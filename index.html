  :root{
    --cream:#F0E6D9;
    --card:#FFFDFA;
    --sage:#A8B187;
    --pink:#C98D8A;
    --gold:#B88855;
    --gold-light:#D1B07B;
    --teal:#5A7C7A;
    --ink:#3C352E;
    --ink-soft:#8A8072;
    --line:#E4D9C8;
    --radius:16px;
    --shadow:0 10px 30px -14px rgba(60,53,46,0.2);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Thmanyah Sans',sans-serif;
    line-height:1.7;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Thmanyah Serif Display',sans-serif;font-weight:700;color:var(--ink);margin:0;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:40px;width:auto;}
  .brand-text{font-size:15px;font-weight:700;color:var(--ink);}
  .status-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);}
  .refresh-btn{
    appearance:none;border:1.5px solid var(--line);background:var(--card);
    border-radius:10px;padding:8px 14px;font-family:'Thmanyah Sans',sans-serif;
    font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:all .15s ease;
  }
  .refresh-btn:hover{border-color:var(--sage);}
  .refresh-btn svg{width:14px;height:14px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sage);display:inline-block;}
  .dot.off{background:var(--pink);}

  /* stat cards */
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;font-weight:500;}
  .stat-card .value{font-family:'Thmanyah Serif Display',sans-serif;font-weight:700;font-size:30px;color:var(--ink);}
  .stat-card .sub{font-size:12px;color:var(--sage);margin-top:4px;font-weight:700;}
  .stat-card.accent-gold .value{color:var(--gold);}
  .stat-card.accent-teal .value{color:var(--teal);}

  /* charts */
  .charts-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-bottom:20px;}
  .chart-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 14px;box-shadow:var(--shadow);
  }
  .chart-card h3{font-size:15px;margin-bottom:14px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .bar-label{width:92px;flex-shrink:0;color:var(--ink-soft);}
  .bar-track{flex:1;height:12px;background:var(--cream);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;transition:width .4s ease;}
  .bar-count{width:26px;flex-shrink:0;text-align:left;font-weight:700;font-size:12.5px;}
  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .legend-item{display:flex;align-items:center;gap:8px;}
  .legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

  /* table */
  .table-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);
  }
  .table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .search-input{
    flex:1;min-width:200px;font-family:'Thmanyah Sans',sans-serif;font-size:13.5px;
    padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream);
    color:var(--ink);outline:none;
  }
  .search-input:focus{border-color:var(--sage);}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{
    text-align:right;padding:10px 8px;color:var(--ink-soft);font-weight:700;
    border-bottom:1.5px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);
  }
  tbody td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td.cell-center{text-align:center;}
  .status-cb{width:17px;height:17px;cursor:pointer;accent-color:var(--sage);}
  .badge.full{background:#EAF0DF;color:#5F7047;}
  .badge.first-month{background:#F3E7D4;color:#8A6423;}
  tbody tr:hover{background:var(--cream);}
  .table-scroll{overflow-x:auto;max-height:520px;overflow-y:auto;}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;
  }
  .badge.yes{background:#EAF0DF;color:#5F7047;}
  .badge.no{background:#F3E7E6;color:#9C5C58;}
  .phone-link{color:var(--teal);text-decoration:none;font-weight:700;direction:ltr;display:inline-block;}
  .phone-link.wa{color:#3d8a6a;}
  .phone-link.wa svg{width:13px;height:13px;vertical-align:-2px;margin-left:3px;}
  .child-link{
    background:none;border:none;padding:0;margin:0;cursor:pointer;
    color:var(--ink);font-family:'Thmanyah Sans',sans-serif;font-weight:700;font-size:12.8px;
    text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;
  }
  .child-link:hover{color:var(--teal);}
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(60,53,46,0.45);
    z-index:50;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--card);border-radius:var(--radius);padding:24px;max-width:380px;width:100%;
    box-shadow:0 20px 50px -10px rgba(0,0,0,0.3);
  }
  .modal-box h3{font-size:17px;margin-bottom:4px;}
  .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .status-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;
  }
  .status-row:last-of-type{border-bottom:none;}
  .status-pill{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;}
  .status-pill.done{background:#EAF0DF;color:#5F7047;}
  .status-pill.pending{background:#F1ECE3;color:var(--ink-soft);}
  .modal-close{
    margin-top:18px;width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);
    background:transparent;font-family:'Thmanyah Sans',sans-serif;font-weight:700;font-size:13.5px;
    color:var(--ink-soft);cursor:pointer;
  }
  .empty-state, .error-state{
    text-align:center;padding:60px 20px;color:var(--ink-soft);
  }
  .error-state{color:var(--pink);}
  .loader{
    text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:14px;
  }
  .row-count{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  @media (max-width:900px){
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    .charts-grid{grid-template-columns:1fr;}
  }
</style>
</head>

  <div class="modal-box">

<script>
/* ============ CONFIG ============ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7vTuYxcTQxcM-6ohyECvOOmLC-XkzMecmnmaylK6TswamVPZWD0bzd2gtbIvoJ71-xQ/exec";
const DISCOUNT_DEADLINE = new Date("2026-08-18T23:59:59+03:00"); // 5 ربيع الأول 1448هـ
const REFRESH_MS = 45000;

const STAGE_COLORS = {"المستوى الأول":"var(--sage)","المستوى الثاني":"var(--teal)","تمهيدي":"var(--gold)"};
const SOURCE_COLORS = ["var(--sage)","var(--teal)","var(--gold)","var(--pink)"];

let refreshTimer = null;
let lastRows = [];

/* ============ حالة المقبولين/المنسحبين (محفوظة في نفس الشيت — يشوفها الجميع) ============ */
function rowKey(r){
  return (r['اسم الطفل']||'') + '|' + (r['جوال الأم']||r['جوال الأب']||'');
}
function getStatus(r){
  return {
    accepted: r['مقبول'] === 'نعم' || r['مقبول'] === true,
    withdrawn: r['منسحب'] === 'نعم' || r['منسحب'] === true
  };
}
async function setStatus(key, field, value){
  // تحديث فوري في الواجهة قبل رد السيرفر
  const row = lastRows.find(r => rowKey(r) === key);
  if(row){
    row[field] = value ? 'نعم' : '';
    if(value){
      const opposite = field === 'مقبول' ? 'منسحب' : 'مقبول';
      row[opposite] = '';
    }
  }
  const box = document.getElementById('searchBox');
  const q = box ? box.value : '';
  render(lastRows);
  if(q){
    const newBox = document.getElementById('searchBox');
    newBox.value = q;
    newBox.dispatchEvent(new Event('input'));
  }

  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // لتفادي مشاكل CORS مع Apps Script
      body: JSON.stringify({action: 'updateStatus', key, field, value})
    });
  }catch(err){
    console.error('تعذّر حفظ الحالة على الشيت:', err);
  }
}

async function loadData(manual){
  const dot = document.getElementById('statusDot');
  try{
    const url = SCRIPT_URL + "?_=" + Date.now();
    const res = await fetch(url);
    const data = await res.json();
    lastRows = data;
    render(data);
    dot.classList.remove('off');
    document.getElementById('lastUpdated').textContent = "آخر تحديث: " + new Date().toLocaleTimeString('ar-SA', {hour:'2-digit',minute:'2-digit'});
  }catch(err){
    dot.classList.add('off');
    if(manual || lastRows.length === 0){
      renderError("تعذّر الاتصال بمصدر البيانات. تأكدي من رابط السكربت والاتصال بالإنترنت.");
    }
    document.getElementById('lastUpdated').textContent = "فشل آخر تحديث";
  }
}

function renderError(msg){
  document.getElementById('content').innerHTML = `<div class="error-state">${msg}</div>`;
}

function render(rows){
  if(!rows || rows.length === 0){
    document.getElementById('content').innerHTML = '<div class="empty-state">لا توجد تسجيلات بعد.</div>';
    return;
  }

  const total = rows.length;
  const boys = rows.filter(r => r['الجنس'] === 'ذكر').length;
  const girls = rows.filter(r => r['الجنس'] === 'أنثى').length;

  const stageCounts = {};
  rows.forEach(r => { const s = r['المرحلة'] || 'غير محدد'; stageCounts[s] = (stageCounts[s]||0)+1; });

  const sourceCounts = {};
  rows.forEach(r => { const s = r['مصدر المعرفة'] || 'غير محدد'; sourceCounts[s] = (sourceCounts[s]||0)+1; });

  const beforeDeadlineCount = rows.filter(r => {
    const t = new Date(r['الوقت']);
    return !isNaN(t) && t <= DISCOUNT_DEADLINE;
  }).length;
  const afterDeadlineCount = total - beforeDeadlineCount;

  let acceptedCount = 0, withdrawnCount = 0;
  rows.forEach(r => {
    const s = getStatus(r);
    if(s.accepted) acceptedCount++;
    if(s.withdrawn) withdrawnCount++;
  });

  const maxStage = Math.max(...Object.values(stageCounts), 1);
  const maxSource = Math.max(...Object.values(sourceCounts), 1);

  let html = '';

  // ---- stat cards ----
  html += `<div class="stats-grid">
    <div class="stat-card"><div class="label">إجمالي التسجيلات</div><div class="value">${total}</div></div>
    <div class="stat-card accent-gold"><div class="label">خصم كامل العام</div><div class="value">${beforeDeadlineCount}</div><div class="sub">سجّلوا قبل ٥ ربيع الأول ١٤٤٨هـ</div></div>
    <div class="stat-card accent-gold"><div class="label">خصم الشهر الأول فقط</div><div class="value">${afterDeadlineCount}</div><div class="sub">سجّلوا بعد ٥ ربيع الأول ١٤٤٨هـ</div></div>
    <div class="stat-card"><div class="label">عدد البنات</div><div class="value">${girls}</div><div class="sub">${total? Math.round(girls/total*100):0}٪ من الإجمالي</div></div>
    <div class="stat-card accent-teal"><div class="label">عدد الأولاد</div><div class="value">${boys}</div><div class="sub">${total? Math.round(boys/total*100):0}٪ من الإجمالي</div></div>
    <div class="stat-card"><div class="label">المقبولون</div><div class="value">${acceptedCount}</div></div>
    <div class="stat-card"><div class="label">المنسحبون</div><div class="value">${withdrawnCount}</div></div>
  </div>`;

  // ---- charts ----
  html += '<div class="charts-grid">';

  // stage bar chart
  html += '<div class="chart-card"><h3>التسجيلات حسب المرحلة</h3>';
  Object.entries(stageCounts).forEach(([stage,count]) => {
    const color = STAGE_COLORS[stage] || 'var(--ink-soft)';
    const pct = (count/maxStage*100).toFixed(0);
    html += `<div class="bar-row">
      <div class="bar-label">${stage}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += '</div>';

  // gender donut
  const girlsPct = total? (girls/total*100) : 0;
  html += `<div class="chart-card"><h3>البنات مقابل الأولاد</h3>
    <div class="donut-wrap">
      ${donutSVG(girlsPct, 'var(--pink)', 'var(--teal)')}
      <div class="donut-legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--pink);"></span>بنات (${girls})</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--teal);"></span>أولاد (${boys})</div>
      </div>
    </div>
  </div>`;

  // source bar chart
  html += '<div class="chart-card"><h3>مصدر معرفة العائلات بسِمة</h3>';
  Object.entries(sourceCounts).forEach(([src,count], i) => {
    const color = SOURCE_COLORS[i % SOURCE_COLORS.length];
    const pct = (count/maxSource*100).toFixed(0);
    html += `<div class="bar-row">
      <div class="bar-label">${src}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  });
  html += '</div>';

  html += '</div>'; // charts-grid

  // ---- table ----
  html += `<div class="table-card">
    <div class="table-head">
      <h3>تفاصيل التسجيلات (لترتيب المقابلات)</h3>
      <input type="text" class="search-input" id="searchBox" placeholder="ابحثي بالاسم أو رقم الجوال...">
    </div>
    <div class="table-scroll">
      <table id="dataTable">
        <thead><tr>
          <th>اسم الطفل (اضغطي للتفاصيل)</th><th>المرحلة</th><th>الجنس</th><th>تاريخ الميلاد</th>
          <th>اسم الأم</th><th>جوال الأم</th><th>جوال الأب</th><th>خصم الافتتاح</th><th>تاريخ التسجيل</th>
          <th>مقبول</th><th>منسحب</th>
        </tr></thead>
        <tbody>`;

  window.__rows = rows;
  rows.slice().reverse().forEach((r, idx) => {
    const t = new Date(r['الوقت']);
    const full = !isNaN(t) && t <= DISCOUNT_DEADLINE;
    const dateStr = !isNaN(t) ? t.toLocaleDateString('ar-SA') : '-';
    const originalIndex = rows.indexOf(r);
    const key = rowKey(r);
    const status = getStatus(r);
    html += `<tr>
      <td><button type="button" class="child-link" onclick="openChildModal(${originalIndex})">${esc(r['اسم الطفل'])}</button></td>
      <td>${esc(r['المرحلة'])}</td>
      <td>${esc(r['الجنس'])}</td>
      <td>${esc(r['تاريخ الميلاد'])}</td>
      <td>${esc(r['اسم الأم'])}</td>
      <td>${waLink(r['جوال الأم'])}</td>
      <td>${waLink(r['جوال الأب'])}</td>
      <td><span class="badge ${full?'full':'first-month'}">${full?'كامل العام':'الشهر الأول فقط'}</span></td>
      <td>${dateStr}</td>
      <td class="cell-center"><input type="checkbox" class="status-cb" data-key="${esc(key)}" data-field="مقبول" ${status.accepted?'checked':''}></td>
      <td class="cell-center"><input type="checkbox" class="status-cb" data-key="${esc(key)}" data-field="منسحب" ${status.withdrawn?'checked':''}></td>
    </tr>`;
  });

  html += `</tbody></table></div><div class="row-count" id="rowCount">${total} تسجيل</div></div>`;

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.status-cb').forEach(cb => {
    cb.addEventListener('change', function(){
      setStatus(this.dataset.key, this.dataset.field, this.checked);
    });
  });

  document.getElementById('searchBox').addEventListener('input', function(){
    const q = this.value.trim().toLowerCase();
    const tbody = document.querySelector('#dataTable tbody');
    let visible = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const match = tr.textContent.toLowerCase().includes(q);
      tr.style.display = match ? '' : 'none';
      if(match) visible++;
    });
    document.getElementById('rowCount').textContent = visible + ' تسجيل';
  });
}

function donutSVG(pct, colorA, colorB){
  const r = 42, c = 2*Math.PI*r;
  const offset = c * (1 - pct/100);
  return `<svg width="110" height="110" viewBox="0 0 110 110">
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${colorB}" stroke-width="14"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${colorA}" stroke-width="14"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 55 55)"/>
  </svg>`;
}

function esc(v){
  if(v === undefined || v === null) return '-';
  return String(v).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function waLink(phone){
  if(!phone) return '-';
  let digits = String(phone).replace(/\D/g,'');
  if(digits.startsWith('0')) digits = digits.slice(1);
  if(!digits.startsWith('966')) digits = '966' + digits;
  return `<a class="phone-link wa" href="https://wa.me/${digits}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.8 14.3c-.2.7-1.4 1.3-2 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.3-5.1-4.5-.2-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1.1 2.2 1.4 2.5 1.6.3.2.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.2.7-.1.3.1 1.7.8 2 .9.3.2.5.2.6.4.1.1.1.7-.1 1.4Z"/></svg>
    ${esc(phone)}
  </a>`;
}

function openChildModal(idx){
  const r = window.__rows[idx];
  if(!r) return;
  const fields = [
    ['التواصل مع الأم', r['تم التواصل مع الأم']],
    ['تحديد موعد المقابلة', r['تم تحديد موعد المقابلة']],
    ['الدفع', r['تم الدفع']]
  ];
  let rowsHtml = '';
  fields.forEach(([label, val]) => {
    const done = String(val||'').trim() === 'نعم';
    rowsHtml += `<div class="status-row">
      <span>${label}</span>
      <span class="status-pill ${done?'done':'pending'}">${done?'تم ✓':'لم يتم بعد'}</span>
    </div>`;
  });
  document.getElementById('modalBody').innerHTML = `
    <h3>${esc(r['اسم الطفل'])}</h3>
    <div class="modal-sub">${esc(r['المرحلة'])} — ولية الأمر: ${esc(r['اسم الأم'])}</div>
    ${rowsHtml}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeChildModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

loadData(false);
refreshTimer = setInterval(() => loadData(false), REFRESH_MS);
</script>
</body>
</html>
